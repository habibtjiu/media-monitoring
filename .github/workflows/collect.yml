name: Kumpulkan mention live
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Satu antrean deploy dengan workflow Deploy ke GitHub Pages, supaya dua
# deploy tidak tabrakan. Push dari GITHUB_TOKEN tidak memicu workflow lain
# (aturan GitHub anti-rekursi), jadi workflow ini men-deploy sendiri
# setelah mengumpulkan — deploy-pages.yml tetap ada untuk push manual.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kumpulkan RSS
        run: python3 collector/collect.py data.json
      - name: Commit kalau ada mention baru
        run: |
          git config user.name "media-monitoring-bot"
          git config user.email "media-monitoring-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: perbarui mention live" && git push
  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Checkout main terbaru (bukan SHA pemicu run), supaya commit data.json
      # yang baru saja di-push job collect ikut ter-deploy — kalau tidak,
      # yang terbit adalah data satu siklus sebelumnya.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
