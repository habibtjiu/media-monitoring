<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Monitoring · Dashboard</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f7fb;
  --surface: #fff;
  --surface-soft: #f8faff;
  --text: #18243a;
  --muted: #66758d;
  --subtle: #7887a0;
  --border: #e3e9f3;
  --track: #edf1f8;
  --blue: #3463e8;
  --blue-soft: #eaf0ff;
  --teal: #087e70;
  --pink: #b94460;
  --shadow: 0 2px 8px #20356606;
  --rail-size: 79px;
  --side-size: 246px;
  --header-size: 64px;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
}
:root.dark {
  color-scheme: dark;
  --bg: #111927;
  --surface: #182235;
  --surface-soft: #1d2a40;
  --text: #edf3ff;
  --muted: #a5b3ca;
  --subtle: #9caac3;
  --border: #2a3952;
  --track: #2b3950;
  --blue: #91abff;
  --blue-soft: #25375e;
  --teal: #64dccb;
  --pink: #ff9fb4;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--text); background: var(--bg); }
button, input, textarea, select { font: inherit; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(24px, 2.5vw, 34px); letter-spacing: -.042em; line-height: 1.16; }
h2 { font-size: 15px; letter-spacing: -.015em; }
p { line-height: 1.55; }
.icon { width: 18px; height: 18px; flex: 0 0 auto; display: inline-block; vertical-align: middle; }
.logo { width: 38px; height: 38px; display: block; flex: 0 0 auto; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; }
.muted, .range { color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.btn, .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 35px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); white-space: nowrap; font-weight: 600; font-size: 12px; }
.icon-btn { width: 35px; padding: 0; }
.btn:hover, .icon-btn:hover, .btn.selected, .icon-btn.selected { color: var(--blue); background: var(--blue-soft); }
.btn.primary { border-color: #3463e8; background: #3463e8; color: #fff; }
.btn.primary:hover { background: #2451cf; }
.btn.danger { color: var(--pink); }
input, textarea, select { width: 100%; min-width: 0; color: var(--text); border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 9px 11px; }
input::placeholder, textarea::placeholder { color: var(--subtle); }
.search-input, .select-wrap { position: relative; display: inline-flex; align-items: center; min-width: 0; color: var(--subtle); }
.search-input .icon, .select-wrap .icon { position: absolute; left: 10px; width: 15px; height: 15px; pointer-events: none; }
.search-input input { padding-left: 32px; }
.search-input input, .select-wrap select { min-height: 35px; font-size: 12px; }
.select-wrap select { width: auto; padding: 7px 29px 7px 10px; appearance: none; color: var(--muted); font-weight: 550; cursor: pointer; }
.select-wrap .icon + select { padding-left: 30px; }
.select-wrap::after { content: ""; position: absolute; right: 12px; width: 5px; height: 5px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translateY(-2px); pointer-events: none; }

.rail { position: fixed; inset: 0 auto 0 0; z-index: 5; width: var(--rail-size); display: flex; flex-direction: column; align-items: stretch; border-right: 1px solid var(--border); background: var(--surface); }
.brand-mark { display: flex; align-items: center; justify-content: center; height: var(--header-size); border-bottom: 1px solid var(--border); }
.rail-nav { display: grid; gap: 7px; padding: 17px 6px; }
.rail-link { min-height: 62px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 7px; font-size: 8.6px; font-weight: 750; text-transform: uppercase; letter-spacing: .025em; }
.rail-link .icon { width: 21px; height: 21px; }
.rail-link:hover, .rail-link.active { background: var(--blue-soft); color: var(--blue); }
.workspace { margin-left: var(--rail-size); }
.topbar { position: sticky; top: 0; z-index: 4; height: var(--header-size); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 23px; }
.topbar-title { font-size: 15px; font-weight: 700; gap: 10px; }
.topbar .icon-btn, .topbar .flag { border-color: transparent; }
.topbar .title-edit { width: 25px; }
.title-edit .icon { width: 14px; height: 14px; }
.top-actions { gap: 7px; }
.topbar .flag { font-size: 17px; padding: 5px 6px; }
.topbar .avatar { border-radius: 50%; background: var(--blue-soft); color: var(--blue); }
.with-dot { position: relative; }
.with-dot::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #ef5e72; box-shadow: 0 0 0 2px var(--surface); }
.workspace-body { display: flex; align-items: flex-start; }
.sidebar { position: sticky; top: var(--header-size); flex: 0 0 var(--side-size); height: calc(100dvh - var(--header-size)); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
.sidebar-intro { padding: 19px 15px 12px; }
.sidebar-title { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
.sidebar-title h2 { font-size: 18px; }
.sidebar-symbol { padding: 7px; background: var(--blue-soft); color: var(--blue); border-radius: 9px; }
.sidebar-intro .search-input { width: 100%; }
.sidebar-intro .search-input input { background: var(--surface-soft); }
.sidebar-scroll { overflow: auto; flex: 1; padding: 0 10px 10px; scrollbar-width: thin; }
.side-folder { margin: 4px 0; }
.side-folder.current { background: var(--surface-soft); border-radius: 9px; }
.folder-btn { display: grid; grid-template-columns: 16px minmax(0, 1fr) 12px; width: 100%; align-items: center; gap: 8px; color: var(--muted); background: transparent; border: 0; border-radius: 9px; text-align: left; padding: 9px 7px; font-size: 11.5px; line-height: 1.36; font-weight: 620; }
.folder-btn:hover, .side-folder.current .folder-btn { color: var(--blue); }
.folder-btn .icon { width: 15px; height: 15px; }
.folder-btn .icon:last-child { width: 12px; height: 12px; }
.subnav { display: grid; gap: 1px; margin: 0 7px 0 15px; padding: 2px 0 7px 7px; border-left: 1px solid var(--border); }
.subnav a { display: block; padding: 6px 8px; border-radius: 7px; color: var(--muted); font-size: 11.8px; font-weight: 520; }
.subnav a:hover, .subnav a.active { background: var(--blue-soft); color: var(--blue); }
.subnav a.active { font-weight: 700; }
.extraction-row { display: flex; align-items: center; }
.extraction-row a { flex: 1; }
.extraction-row .icon-btn { width: 25px; min-height: 24px; border: 0; background: transparent; }
.extraction-row .icon { width: 13px; height: 13px; }
.extraction-sub { margin-left: 10px; }
.sidebar-bottom { padding: 12px; border-top: 1px solid var(--border); }
.sidebar-bottom .btn { width: 100%; justify-content: flex-start; background: var(--surface-soft); }
.side-empty { color: var(--muted); font-size: 12px; padding: 10px; }

.main-content { flex: 1; min-width: 0; max-width: 1750px; margin: 0 auto; padding: 23px clamp(17px, 2vw, 31px) 0; }
.page-heading { margin-bottom: 20px; }
.breadcrumb { font-size: 11px; font-weight: 650; color: var(--blue); margin-bottom: 9px; }
.breadcrumb span { margin: 0 4px; color: var(--subtle); }
.page-heading p { color: var(--muted); margin-top: 6px; font-size: 12px; }
footer { color: var(--subtle); font-size: 11px; padding: 10px 0 19px; text-align: center; }
.stat-grid { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 12px; margin-bottom: 17px; }
.stat, .panel { border: 1px solid var(--border); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.stat { padding: 12px; }
.stat-top { display: flex; align-items: center; justify-content: space-between; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 650; min-height: 28px; }
.stat-icon { display: grid; place-items: center; flex: 0 0 28px; height: 28px; border-radius: 8px; }
.stat-icon .icon { width: 16px; height: 16px; }
.stat-icon.blue { color: #3865e9; background: #eaf0ff; }
.stat-icon.teal { color: #108a7a; background: #e0f8f2; }
.stat-icon.slate { color: #657792; background: #edf1f7; }
.stat-icon.pink { color: #d55271; background: #fff0f3; }
.stat-icon.violet { color: #7957d8; background: #f0ebff; }
.stat-icon.green { color: #238853; background: #e6f7ec; }
.stat > strong { display: block; margin: 4px 0 2px; font-size: clamp(20px,2vw,29px); letter-spacing: -.055em; white-space: nowrap; }
.stat small { color: var(--muted); font-size: 10px; white-space: nowrap; }
.toolbar { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 15px; }
.toolbar .row { flex-wrap: wrap; }
.overview-tools .search-input { width: clamp(140px,18vw,230px); }
.range { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 550; }
.range .icon { width: 14px; height: 14px; }
.panel { padding: 15px 16px; margin-bottom: 15px; }
.panel-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 12px; min-height: 20px; }
.panel-head .row { flex-wrap: wrap; justify-content: flex-end; }
.panel-total { display: flex; align-items: baseline; gap: 7px; margin: 4px 0 10px; color: var(--muted); font-size: 11px; }
.panel-total strong { color: var(--text); font-size: 25px; letter-spacing: -.05em; }
.double, .triple, .voice-grid { display: grid; align-items: stretch; gap: 14px; }
.double { grid-template-columns: repeat(2,minmax(0,1fr)); }
.triple, .voice-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
.comparison-grid { grid-template-columns: minmax(0,1.75fr) minmax(0,1fr); }
.movement-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 9px; align-items: center; color: var(--muted); font-size: 11px; margin: 0 0 10px; }
.tabs, .icon-segment { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.tabs .btn { font-size: 11px; }
.segment, .icon-segment { background: var(--surface-soft); padding: 2px; border: 1px solid var(--border); border-radius: 9px; }
.segment .btn, .icon-segment .icon-btn { min-height: 28px; border: 0; background: transparent; border-radius: 6px; }
.icon-segment .icon-btn { width: 29px; }
.icon-segment .icon { width: 15px; height: 15px; }
.segment .btn.selected, .icon-segment .icon-btn.selected { background: var(--blue-soft); color: var(--blue); }
.dot { width: 8px; height: 8px; display: inline-block; flex: 0 0 auto; background: var(--dot); border-radius: 50%; }
.legend { display: flex; gap: 7px 12px; flex-wrap: wrap; font-size: 10px; color: var(--muted); align-items: center; }
.legend span, .stack-values span { display: inline-flex; align-items: center; gap: 5px; }
.chart-scroll { width: 100%; overflow: auto; }
.chart { width: 100%; height: auto; display: block; aspect-ratio: var(--chart-ratio); overflow: visible; }
.chart line { stroke: var(--border); stroke-dasharray: 4 4; }
.chart text { fill: var(--subtle); font-family: inherit; font-size: 11px; }
.chart-point { cursor: crosshair; }
.chart-point:hover { fill: var(--blue-soft); r: 6; }
.movement .chart { min-height: 178px; max-height: 270px; }
.engagement-panel .chart { min-height: 80px; }
.engagement-panel .chart text { font-size: 10px; }
.donut-block { display: flex; align-items: center; gap: 14px; justify-content: center; min-height: 125px; }
.donut { border-radius: 50%; flex: 0 0 clamp(78px,8.4vw,122px); aspect-ratio: 1; display: grid; place-items: center; background: var(--ring); }
.donut > div { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 72%; height: 72%; border-radius: 50%; background: var(--surface); }
.donut strong { font-size: clamp(15px,1.5vw,23px); letter-spacing: -.05em; }
.donut span { color: var(--muted); font-size: 9px; }
.detailed-legend { min-width: 0; flex: 1; display: grid; gap: 9px; font-size: 11px; }
.detailed-legend > div { display: flex; align-items: center; gap: 6px; }
.detailed-legend span { flex: 1; color: var(--muted); overflow-wrap: anywhere; }
.detailed-legend strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars { display: grid; gap: 11px; margin: 13px 0 4px; }
.bar-row { display: grid; grid-template-columns: minmax(75px, auto) 1fr auto; align-items: center; gap: 7px; font-size: 11px; }
.bar-row > span { color: var(--muted); overflow-wrap: anywhere; }
.bar-row > div { background: var(--track); border-radius: 99px; height: 7px; min-width: 20px; }
.bar-row i { display: block; height: 100%; border-radius: inherit; }
.ranking { list-style: none; margin: 8px 0 0; padding: 0; }
.ranking li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.ranking li:last-child { border-bottom: 0; }
.rank { background: var(--blue-soft); color: var(--blue); font-size: 10px; text-align: center; border-radius: 6px; padding: 4px; }
.chips { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 7px; }
.chip { background: var(--surface-soft); border: 1px solid var(--border); color: var(--muted); padding: 5px 8px; border-radius: 7px; font-size: 11px; }
.chip:hover, .chip.selected { color: var(--blue); background: var(--blue-soft); }
.chip b { margin-left: 7px; color: var(--blue); }

.insight { color: var(--blue); font-size: 21px; font-weight: 750; }
.section-note { margin: 0 0 10px; font-size: 12px; }
.empty { display: grid; place-items: center; gap: 6px; min-height: 105px; color: var(--muted); font-size: 12px; text-align: center; }
.empty .icon { width: 26px; height: 26px; opacity: .75; }
.badge { display: inline-flex; align-items: center; min-height: 21px; border-radius: 20px; padding: 3px 8px; background: var(--blue-soft); color: var(--blue); font-size: 10px; font-weight: 650; }
.badge.positive { background: #dff8f1; color: #087a65; }
.badge.neutral { background: var(--track); color: var(--muted); }
.badge.negative { background: #ffe9ee; color: #b7435b; }
.badge.moderate { background: #fff0d9; color: #9b5611; }
.search-hero { text-align: center; padding: 30px 20px; }
.search-art { width: 130px; height: 120px; margin: 0 auto 10px; position: relative; border-radius: 50%; background: radial-gradient(circle, var(--blue-soft) 0 55%, transparent 56%); }
.search-sheet { position: absolute; left: 33px; top: 19px; width: 52px; height: 69px; border: 2px solid #8fa9f4; border-radius: 8px; padding: 14px 9px; transform: rotate(-12deg); background: var(--surface); box-shadow: 0 8px 18px #4675ed22; }
.search-sheet i { display: block; width: 92%; height: 4px; background: #b4c6fc; border-radius: 3px; margin-bottom: 7px; }
.search-sheet i:nth-child(2) { width: 75%; }
.search-glass { position: absolute; left: 65px; top: 48px; display: grid; place-items: center; width: 45px; height: 45px; background: #3463e8; color: white; border-radius: 13px; box-shadow: 0 8px 15px #3463e84d; transform: rotate(10deg); }
.search-glass .icon { width: 26px; height: 26px; }
.search-spark { position: absolute; right: 11px; top: 18px; color: #9272eb; font-size: 18px; }
.search-form { width: min(650px,100%); margin: 20px auto 0; border: 1px solid var(--border); background: var(--surface-soft); border-radius: 12px; padding: 10px; }
.search-form textarea { border: 0; background: transparent; display: block; resize: vertical; min-height: 68px; }
.search-form .form-actions { justify-content: space-between; margin-top: 3px; font-size: 11px; color: var(--muted); padding-left: 10px; }
.saved-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.saved-list a, .product-card { display: flex; align-items: center; gap: 9px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); font-size: 12px; color: var(--text); }
.saved-list a:hover, .product-card:hover { color: var(--blue); border-color: var(--blue); }
.saved-list a span { flex: 1; }
.saved-list a .icon:first-child { color: var(--blue); }
.article { display: flex; align-items: flex-start; gap: 11px; padding: 12px 2px; border-top: 1px solid var(--border); }
.article-symbol { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 34px; color: var(--blue); background: var(--blue-soft); border-radius: 8px; }
.article-content { flex: 1; min-width: 0; }
.article-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; color: var(--muted); font-size: 11px; }
.article-meta .icon { width: 12px; height: 12px; }
.article-title { display: block; border: 0; background: none; color: var(--text); padding: 5px 0 7px; text-align: left; font-weight: 650; line-height: 1.35; }
.article-title:hover { color: var(--blue); }
.marked { color: var(--blue); background: var(--blue-soft); }
.marked .icon { fill: currentColor; fill-opacity: .19; }
.timeline-date { display: flex; align-items: center; gap: 8px; background: var(--surface-soft); padding: 9px; color: var(--blue); font-size: 12px; margin-top: 8px; }
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 9px; color: var(--muted); font-size: 11px; margin-top: 12px; }
.pagination .icon-btn { width: 28px; min-height: 28px; font-size: 17px; }
.stack-list { display: grid; gap: 13px; margin: 15px 0 5px; }
.stack-row { display: grid; gap: 6px; font-size: 11px; }
.stack-track { display: flex; min-height: 19px; border-radius: 5px; overflow: hidden; background: var(--track); }
.stack-track span { min-width: 1px; line-height: 19px; display: block; font-size: 9px; font-weight: 700; text-align: center; color: #14243a; overflow: hidden; white-space: nowrap; }
.stack-values { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 10px; }
.region-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 11px; }
.region-footer .pagination { margin: 0; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; text-align: left; }
th, td { padding: 11px 9px; border-bottom: 1px solid var(--border); font-size: 11px; }
th { white-space: nowrap; background: var(--surface-soft); color: var(--muted); font-weight: 750; letter-spacing: .025em; }
tbody tr:hover { background-color: var(--surface-soft); }
.crisis-meta { font-size: 12px; margin: 0 0 8px; color: var(--muted); }
.crisis-tools { justify-content: flex-start; }
.crisis-panel td { min-width: 60px; }
.crisis-panel td:nth-child(2) { font-weight: 650; min-width: 118px; }
.crisis-panel td:nth-child(3), .crisis-panel td:nth-child(7) { min-width: 102px; }
.crisis-panel td .badge { white-space: nowrap; }
.crisis-panel td:first-child { min-width: auto; }
.crisis-actions { gap: 4px; }
.crisis-actions .icon-btn { width: 26px; min-height: 26px; }
.crisis-actions .icon { width: 13px; height: 13px; }

.overlay-open { overflow: hidden; }
.overlay-backdrop { position: fixed; inset: 0; z-index: 10; background: #131f4064; }
.modal, .drawer { position: fixed; z-index: 11; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 18px 60px #14244936; display: flex; flex-direction: column; outline: none; }
.modal { top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(515px,calc(100vw - 30px)); max-height: 90dvh; border-radius: 15px; }
.drawer { inset: 0 0 0 auto; width: min(460px,100%); animation: slide-in .2s ease-out; }
@keyframes slide-in { from { transform: translateX(100%); } }
.modal > header, .drawer > header { border-bottom: 1px solid var(--border); padding: 14px 17px; display: flex; justify-content: space-between; align-items: center; gap: 7px; }
.modal > header h2, .drawer > header h2 { font-size: 18px; overflow-wrap: anywhere; }
.overlay-content { padding: 16px; overflow: auto; }
.drawer .overlay-content { flex: 1; display: flex; flex-direction: column; }
.drawer-bottom { margin-top: auto; padding-top: 16px; }
.drawer-bottom .btn { width: 100%; justify-content: flex-start; }
.stack-form, .login-card form { display: grid; gap: 13px; }
.stack-form > button { justify-self: start; }
.stack-form label:not(.select-wrap), .login-card label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 650; }
.form-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.manage-list { display: grid; margin: 12px 0; }
.manage-list > div { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.manage-list > div > span { overflow-wrap: anywhere; }
.manage-list .icon-btn { width: 29px; min-height: 29px; }
.manage-list .icon { width: 14px; height: 14px; }
.detail { display: grid; gap: 10px; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 15px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.detail .btn { justify-self: start; }
.product-card { width: 100%; text-align: left; }

let chartId = 0;
function chart(labels, series, mode = 'line', height = 200, width = 920) {
  const left = width < 400 ? 29 : 46, right = width - (width < 400 ? 12 : 30), top = 12, bottom = height - 28;
  const largest = Math.max(1, ...series.flatMap(entry => entry.values));
  const stepUnit = 10 ** Math.floor(Math.log10(largest / 4));
  const ratio = largest / 4 / stepUnit;
  const step = [1, 2, 2.5, 5, 10].find(option => option >= ratio) * stepUnit;
  const maximum = Math.max(4, Math.ceil(largest / step) * step);
  const x = index => left + (right - left) * (index + .5) / Math.max(labels.length, 1);
  const y = value => bottom - (bottom - top) * value / maximum;
  const id = 'fade-' + ++chartId;
  const guides = Array.from({length:5}, (_, i) => {
    const value = maximum * i / 4;
    return '<line x1="' + left + '" x2="' + right + '" y1="' + y(value) + '" y2="' + y(value) + '"/><text x="' + (left - 10) + '" y="' + (y(value) + 4) + '" text-anchor="end">' + fmt(value) + '</text>';
  }).join('');
  const tick = Math.ceil(labels.length / (width < 400 ? 4 : 7));
  const dates = labels.map((label, i) => i % tick === 0 || i === labels.length - 1 ? '<text x="' + x(i) + '" y="' + (bottom + 22) + '" text-anchor="middle">' + e(label) + '</text>' : '').join('');
  const lines = series.map((entry, s) => {
    const points = entry.values.map((value, i) => [x(i), y(value)]);
    const polyline = points.map(point => point.join(',')).join(' ');
    const title = (value, i) => '<title>' + e(labels[i] + ' · ' + entry.label + ' · ' + fmt(value)) + '</title>';
    if (mode === 'bar') {
      const barWidth = Math.min(28, (right - left) / labels.length / (series.length + 1));
      return entry.values.map((value, i) => '<rect rx="2" fill="' + entry.color + '" x="' + (x(i) + barWidth * (s - series.length / 2)) + '" y="' + y(value) + '" width="' + Math.max(1, barWidth - 2) + '" height="' + (bottom - y(value)) + '">' + title(value, i) + '</rect>').join('');
    }
    const area = mode === 'area' && s === 0 && points.length ? '<polygon points="' + points[0][0] + ',' + bottom + ' ' + polyline + ' ' + points.at(-1)[0] + ',' + bottom + '" fill="url(#' + id + ')"/>' : '';
    return area + '<polyline points="' + polyline + '" fill="none" stroke="' + entry.color + '" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
      points.map(([cx, cy], i) => '<circle class="chart-point" cx="' + cx + '" cy="' + cy + '" r="' + (labels.length > 14 ? 2.7 : 4) + '" stroke="' + entry.color + '" stroke-width="2" fill="var(--surface)">' + title(entry.values[i], i) + '</circle>').join('');
  }).join('');
  return '<div class="chart-scroll"><svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="' + e(series.map(item => item.label).join(', ')) + '" style="--chart-ratio:' + width + '/' + height + '"><defs><linearGradient id="' + id + '" x2="0%" y2="100%"><stop stop-color="' + (series[0]?.color || palette[0]) + '" stop-opacity=".22"/><stop offset="100%" stop-color="' + (series[0]?.color || palette[0]) + '" stop-opacity=".025"/></linearGradient></defs><g class="chart-grid">' + guides + '</g>' + dates + lines + '</svg></div>';
}

function exportCSV(filename, header, rows) {
  const cell = value => {
    const text = String(value ?? '');
    const numeric = /^-?\d+(?:[.,]\d+)?(?:% \(\d+\))?$/.test(text);
    const safe = /^[\s]*[=+@-]|^[\t\r]/.test(text) && !numeric ? "'" + text : text;
    return '"' + safe.replaceAll('"','""') + '"';
  };
  const csv = [header,...rows].map(row => row.map(cell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename + '.csv';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),1000);
  notify('CSV siap diunduh.');
}

  state.crisisPage = 1;
  render();
}
function updateBookmarks(id) {
  const wasSaved = Object.hasOwn(state.bookmarks,id);
  if (wasSaved) delete state.bookmarks[id];
  else state.bookmarks[id] = '';
  saveState('bookmarks');
  refreshOverlay();
  notify(wasSaved ? 'Artikel dihapus dari Bookmark.' : 'Artikel disimpan ke Bookmark.');
}
function removeSaved(kind,name) {
  const key = kind === 'topic' ? 'topics' : 'comparisons';
  state[key] = state[key].filter(entry => entry !== name);
  saveState(key);
  if (kind === 'topic') {
    state.topicOpen.delete(name);
    delete state.topicAliases[name];
    saveState('topicAliases');
  }
  route = getRoute();
  refreshOverlay();
}
const overlayActions = ['bookmarks','manageTopics','manageComparison','renameTopic','renameComparison','manageLabels','bookmarkAdd','assignLabel',
  'editCrisis','deleteCrisis','filters','article','products','account','profile','settings','sector','package','language',
  'notifications','downloads','movementMenu','voiceMenu'];
document.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const {action: name,value} = button.dataset;
  if (overlayActions.includes(name)) {
    if (name === 'bookmarkAdd') state.addBookmarkFind = '';
    openOverlay(name,value);
    return;
  }
  const separator = value.indexOf('|');
  const field = value.slice(0,separator), setting = value.slice(separator + 1);
  switch (name) {
    case 'close': closeOverlay(); break;
    case 'set': setField(field,setting); render(); break;
    case 'sidebar': {
      if (!['topic','comparison'].includes(route.section)) {
        state.sidebar = true; go('topic'); break;
      }
      state.sidebar = !state.sidebar; render(); break;
    }
    case 'topicFolder':
      if (state.topicOpen.has(value)) state.topicOpen.delete(value);
      else state.topicOpen.add(value);
      render(); break;
    case 'comparisonFolder':
      if (value === route.name) { state.comparisonOpen = !state.comparisonOpen; render(); }
      else { state.comparisonOpen = true; go('comparison',value,'Dashboard'); }
      break;
    case 'toggleExtraction': state.extraction = !state.extraction; render(); break;
    case 'theme': state.dark = !state.dark; saveState('dark'); render(); break;
    case 'home': go('topic',state.topics[0],'Overview'); break;
    case 'demoLogin': state.user = 'demo@demo.id'; saveState('user'); render(); break;
    case 'logout':
      state.user = ''; saveState('user'); closeOverlay(); render(); break;
    case 'chooseLanguage':
      state.language = value; saveState('language'); closeOverlay(); render(); break;
    case 'clearAdvanced': state.channel = ''; state.region = ''; refreshOverlay(); break;
    case 'preset': changePreset(field,setting); break;
    case 'listPage':
    case 'crisisPage': state[name] = Number(value); render(); break;
    case 'regionPage': state.regionPage = Number(value) - 1; render(); break;
    case 'bookmark': updateBookmarks(value); break;
    case 'bookmarkSearch':
      state.bookmarkSearch = !state.bookmarkSearch;
      if (!state.bookmarkSearch) state.bookmarkFind = '';
      renderOverlay();
      overlay.querySelector('[data-live="bookmarkFind"]')?.focus();
      break;
    case 'bookmarkLabel': state.bookmarkLabel = value; renderOverlay(); break;
    case 'saveLabel':
      state.bookmarks[field] = setting; saveState('bookmarks'); openOverlay('bookmarks'); break;
    case 'removeLabel':
      state.labels = state.labels.filter(label => label !== value);
      Object.keys(state.bookmarks).forEach(id => { if (state.bookmarks[id] === value) state.bookmarks[id] = ''; });
      if (state.bookmarkLabel === value) state.bookmarkLabel = '';
      saveState('labels'); saveState('bookmarks'); renderOverlay(); break;
    case 'removeTopic': removeSaved('topic',value); break;
    case 'removeComparison': removeSaved('comparison',value); break;
    case 'pauseCrisis':
      state.crises = state.crises.map(crisis => crisis.id === Number(value) ? {...crisis,status:crisis.status === 'Paused' ? 'Active' : 'Paused'} : crisis);
      saveState('crises'); render(); break;
    case 'confirmCrisis':
      state.crises = state.crises.filter(crisis => crisis.id !== Number(value));
      saveState('crises'); closeOverlay(); render(); notify('Crisis dihapus.'); break;
    case 'crisisCSV':
      exportCSV('crisis-alert',crisisHeaders.slice(0,-1),crisisRows().map((crisis,i) => crisisValues(crisis,i+1))); break;
    case 'mediaCSV':
      exportCSV('media-monitoring',['Date','Source','Title','Sentiment','Emotion','Engagement','Person','Organization','Keyword','Region'],data.map(item => [
        item.date,item.source,item.title,item.sentiment,item.emotion,item.engagement,item.person,item.organization,item.keywords.join('; '),item.region
      ])); break;
    case 'movementCSV': {
      const range = topicRange();
      const items = topicSource(route.name).filter(item => topicFilter(item,range));
      const dates = allDates.filter(date => inRange({date},range));
      const labels = state.based === 'Data Source' ? sources : savedDefaults.slice(1).concat(primary);
      const movement = seriesFor(items,dates,labels,state.based === 'Data Source' ? 'channel' : 'topic',state.metric === 'Total Engagement' ? 'engagement' : '',palette,state.group);
      exportCSV('data-movement',['Date',...labels],movement.labels.map((date,i) => [date,...movement.series.map(entry => entry.values[i])])); break;
    }
    case 'voiceCSV': {
      const brand = brands[Number(value)];
      const items = compItems().filter(item => item.brand === brand);
      exportCSV('share-of-voice-' + brand.toLowerCase().replaceAll(' ','-'),['Entity','Total Data',...sentiments],[[brand,Math.round(compCount(items)),...compSentiments(items).map(value => perc(value,2))]]); break;
    }
  }
});
document.addEventListener('change',event => {
  const field = event.target.dataset.field;
  if (!field) return;
  setField(field,event.target.value);
  render();
});
document.addEventListener('input',event => {
  const target = event.target;
  if (target.id === 'search-term') {
    document.querySelector('#search-counter').textContent = target.value.length + '/4000';
    return;
  }
  const field = target.dataset.live;
  if (!field) return;
  setField(field,target.value);
  switch(field) {
    case 'sidebarSearch': document.querySelector('#side-folders').innerHTML = sidebarContents(); return;
    case 'savedSearch': document.querySelector('#search-saved').innerHTML = searchSaved(); return;
    case 'bookmarkFind': document.querySelector('#bookmarked-items').innerHTML = bookmarkItems(); return;
    case 'addBookmarkFind': document.querySelector('#bookmark-candidates').innerHTML = bookmarkCandidates(); return;
    case 'crisisFind': document.querySelector('#crisis-table').innerHTML = crisisTable(); return;
    default: {
      const cursor = target.selectionStart;
      render();
      const next = document.querySelector('[data-live="' + field + '"]');
      next?.focus({preventScroll:true});
      next?.setSelectionRange(cursor,cursor);
    }
  }
});
document.addEventListener('submit',event => {
  const form = event.target;
  const {form: type,kind,id,original} = form.dataset;
  if (!type) return;
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(form));
  switch (type) {
    case 'login':
      state.user = fields.email.trim() || 'demo@demo.id';
      saveState('user'); render(); break;
    case 'search':
      state.search = fields.term.trim(); state.searched = true; state.listPage = 1; render(); break;
    case 'manage':
    case 'rename': {
      const name = fields.name.trim();
      const key = kind === 'topic' ? 'topics' : 'comparisons';
      if (!name || state[key].some(entry => entry !== original && entry.toLowerCase() === name.toLowerCase())) { notify('Masukkan nama yang unik.'); return; }
      state[key] = type === 'manage' ? [...state[key],name] : state[key].map(entry => entry === original ? name : entry);
      saveState(key);
      if (type === 'rename') {
        if (kind === 'topic' && name !== original) {
          state.topicAliases[name] = state.topicAliases[original] || original;
          delete state.topicAliases[original];
          state.topicOpen.delete(original);
          state.topicOpen.add(name);
          saveState('topicAliases');
        }
        go(kind,name,route.page || (kind === 'topic' ? 'Overview' : 'Dashboard'));
      }
      else refreshOverlay();
      break;
    }
    case 'label': {
      const label = fields.name.trim();
      if (!label || state.labels.some(entry => entry.toLowerCase() === label.toLowerCase())) { notify('Masukkan label yang unik.'); return; }
      state.labels.push(label); saveState('labels'); renderOverlay(); break;
    }
    case 'dates':
    case 'crisis':
      if (fields.end < fields.start) { notify('Tanggal akhir harus sama atau setelah tanggal mulai.'); return; }
      if (type === 'dates') {
        state[kind + 'Start'] = fields.start; state[kind + 'End'] = fields.end; state[kind + 'Period'] = 'Set Time';
        state.crisisPage = 1;
      } else {
        if (!fields.name.trim()) { notify('Masukkan nama crisis.'); return; }
        fields.name = fields.name.trim();
        if (id) state.crises = state.crises.map(crisis => crisis.id === Number(id) ? {...crisis,...fields} : crisis);
        else state.crises = [{
          id:Date.now(), detected:new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric'}).format(new Date()) +
            ', ' + new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}).format(new Date()),
          mentions:0, by:'manual', growth:'New, 0% (0)', status:'Active', ...fields
        },...state.crises];
        saveState('crises'); state.crisisPage = 1;
      }
      closeOverlay(); render(); break;
    case 'profile':
      state.profile = {name:fields.name.trim()};
      saveState('profile'); closeOverlay(); render(); notify('Pengaturan akun demo disimpan.'); break;
  }
});
document.addEventListener('keydown',event => {
  if (!overlayContext) return;
  if (event.key === 'Escape') closeOverlay();
  if (event.key !== 'Tab') return;
  const dialog = overlay.querySelector('[role="dialog"]');
  const controls = [...dialog.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];
  if (!controls.length) return;
  if (event.shiftKey && (document.activeElement === controls[0] || document.activeElement === dialog)) {
    event.preventDefault(); controls.at(-1).focus();
  } else if (!event.shiftKey && document.activeElement === controls.at(-1)) {
    event.preventDefault(); controls[0].focus();
  }
});
state.topicAliases = Object.assign(Object.create(null), storage.get('topicAliases', {}));
if (route.section === 'topic' && route.name) state.topicOpen.add(route.name);
state.extraction = extraPages.includes(route.page);
state.compStart = allDates[0]; state.compEnd = allDates.at(-1);
state.crisisStart = shiftISO(allDates.at(-1), -6); state.crisisEnd = allDates.at(-1);
let liveMode = false, liveUpdatedAt = '';
const footerText = () => liveMode ? 'Live — data realtime, diperbarui ' + liveUpdatedAt : 'Demo — data contoh';
const engText = value => liveMode ? '—' : fmt(value);
const crisisMentions = crisis => liveMode ? liveCrisisMentions(crisis) : crisis.mentions;
function liveCrisisMentions(crisis) {
  const words = crisis.id === 1 ? ['artha graha', 'jefri', 'andi buchari', 'benny', 'tokoh'] : crisis.id === 2 ? ['cs palsu', 'customer service palsu', 'penipuan', 'scam', 'palsu'] : crisis.name.toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 4);
  const hay = item => (item.title + ' ' + item.keywords.join(' ') + ' ' + item.topic).toLowerCase();
  return data.filter(item => inRange(item, [allDates[0], allDates.at(-1)]) && words.some(w => hay(item).includes(w))).length;
}
function bootLive() {
  if (typeof fetch !== 'function') return;
  const fetchJSON = (url, ms) => Promise.race([fetch(url).then(res => { if (!res.ok) throw new Error('http ' + res.status); return res.json(); }), new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
  try {
    const dataURL = new URL('data.json', location.href);
    dataURL.searchParams.set('t', Date.now());
    fetchJSON(dataURL, 8000).then(payload => {
    const items = Array.isArray(payload) ? payload : payload.items;
    if (!items || !items.length) return;
    items.forEach(item => { item.comparisonWeight = 1; item.sentimentWeight = 1; });
    data.length = 0; data.push(...items);
    liveMode = true;
    liveUpdatedAt = (payload.generated_at_wib || '').toString();
    state.period = 'Last 30 days';
    render();
    }).catch(() => {});
  } catch { /* tetap pakai data contoh */ }
}
render();
bootLive();
